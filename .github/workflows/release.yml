name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: download modules
        run: go mod download

      - name: go test
        run: go test ./...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/bx${{ matrix.ext }}" .

      - name: archive
        uses: actions/upload-artifact@v4
        with:
          name: bx-${{ matrix.target }}
          path: dist/bx${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: list artifacts
        run: ls -la artifacts

      - name: create checksums
        working-directory: artifacts
        run: |
          for f in bx-*/*; do
            sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/bx-linux-amd64/bx
            artifacts/bx-linux-arm64/bx
            artifacts/bx-darwin-amd64/bx
            artifacts/bx-darwin-arm64/bx
            artifacts/bx-windows-amd64/bx.exe
            artifacts/bx-windows-arm64/bx.exe
            artifacts/checksums.txt